#
# CI workflow: simulation builds for PRs and pushes.
# Runs cmake+ninja+ctest with OE_SIMULATION=1 (no SGX hardware required).
# Jobs:
#   - Ubuntu 20.04  (container: openenclavedockerregistry.azurecr.io/oetools-20.04)
#   - Ubuntu 22.04  (container: openenclavedockerregistry.azurecr.io/oetools-22.04)
#   - Azure Linux 3 (container: built from Dockerfile.azurelinux3-dev in this repo)

name: CI

on:
  push:
    branches:
      - master
      - azurelinux3-support
    paths-ignore:
      - '**/*.md'
      - docs/**
      - VERSION
      - OWNERS
  pull_request:
    branches:
      - master
      - azurelinux3-support
    paths-ignore:
      - '**/*.md'
      - docs/**
      - VERSION
      - OWNERS

env:
  CMAKE_BUILD_TYPE: RelWithDebInfo
  LVI_MITIGATION: None
  CTEST_TIMEOUT: 480

jobs:
  # -----------------------------------------------------------------------
  # Simulation build on Ubuntu 20.04
  # -----------------------------------------------------------------------
  sim-ubuntu-2004:
    name: Sim Ubuntu 20.04 clang-11 RelWithDebInfo
    runs-on: ubuntu-20.04

    container:
      image: openenclavedockerregistry.azurecr.io/oetools-20.04:latest
      options: --cap-add=SYS_PTRACE

    env:
      OE_SIMULATION: 1
      CC: clang-11
      CXX: clang++-11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DLVI_MITIGATION=${{ env.LVI_MITIGATION }} \
            -DLVI_MITIGATION_SKIP_TESTS=ON \
            -DUSE_DEBUG_MALLOC=ON \
            -Wdev ..

      - name: Build
        working-directory: build
        run: ninja -j$(nproc)

      - name: Test
        working-directory: build
        run: |
          ctest --output-on-failure \
                --timeout ${{ env.CTEST_TIMEOUT }} \
                --repeat until-pass:3

  # -----------------------------------------------------------------------
  # Simulation build on Ubuntu 22.04
  # -----------------------------------------------------------------------
  sim-ubuntu-2204:
    name: Sim Ubuntu 22.04 clang-11 RelWithDebInfo
    runs-on: ubuntu-22.04

    container:
      image: openenclavedockerregistry.azurecr.io/oetools-22.04:latest
      options: --cap-add=SYS_PTRACE

    env:
      OE_SIMULATION: 1
      CC: clang-11
      CXX: clang++-11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DLVI_MITIGATION=${{ env.LVI_MITIGATION }} \
            -DLVI_MITIGATION_SKIP_TESTS=ON \
            -DUSE_DEBUG_MALLOC=ON \
            -Wdev ..

      - name: Build
        working-directory: build
        run: ninja -j$(nproc)

      - name: Test
        working-directory: build
        run: |
          ctest --output-on-failure \
                --timeout ${{ env.CTEST_TIMEOUT }} \
                --repeat until-pass:3

  # -----------------------------------------------------------------------
  # Simulation build on Azure Linux 3.0
  # Builds the dev container image from Dockerfile.azurelinux3-dev, then
  # runs cmake + ninja + ctest in simulation mode.
  # -----------------------------------------------------------------------
  sim-azurelinux3:
    name: Sim Azure Linux 3.0 clang RelWithDebInfo
    runs-on: ubuntu-22.04

    env:
      OE_SIMULATION: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Azure Linux 3.0 dev container
        run: |
          docker build \
            -f Dockerfile.azurelinux3-dev \
            -t oetools-azl3:ci \
            .

      - name: Configure, build, and test (simulation mode)
        run: |
          # Write the build+test script to a file so the regex does not need
          # to be embedded in a double-quoted bash string (avoids quoting issues).
          cat > /tmp/oe-azl3-build.sh << 'BUILDSCRIPT'
          #!/bin/bash
          set -ex
          cd /src
          mkdir -p build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DLVI_MITIGATION=${{ env.LVI_MITIGATION }} \
            -DLVI_MITIGATION_SKIP_TESTS=ON \
            -DUSE_DEBUG_MALLOC=ON \
            ..
          ninja -j$(nproc)
          # Exclude tests known to fail on Azure Linux 3 in simulation mode:
          #   oegdb-test / oegdb-test-simulation-mode: GDB extension incompatibility
          #   oelldb-test: LLDB extension incompatibility
          #   tests/host_verify: requires live SGX quote verification
          #   tests/resolver: DNS resolution unavailable in container
          #   libcxxtest std::thread tests: SEGFAULT/bus-error in simulation mode
          ctest --output-on-failure \
                --timeout ${{ env.CTEST_TIMEOUT }} \
                --repeat until-pass:3 \
                --exclude-regex 'oegdb-test|oelldb-test|tests/host_verify|tests/resolver|make_ready_at_thread_exit|task_futures\.task\.members_operator|algorithm_lock'
          BUILDSCRIPT

          docker run --rm \
            --cap-add=SYS_PTRACE \
            -v "${{ github.workspace }}:/src" \
            -v /tmp/oe-azl3-build.sh:/oe-build.sh \
            -w /src \
            -e OE_SIMULATION=1 \
            -e CC=clang \
            -e CXX=clang++ \
            oetools-azl3:ci \
            bash /oe-build.sh

  # -----------------------------------------------------------------------
  # Check CI script (format / lint checks, no SGX needed)
  # -----------------------------------------------------------------------
  check-ci:
    name: Check CI
    runs-on: ubuntu-22.04

    container:
      image: openenclavedockerregistry.azurecr.io/oetools-22.04:latest
      options: --cap-add=SYS_PTRACE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run check-ci script
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/check-ci
